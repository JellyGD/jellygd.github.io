# =============================================================
# JellyGD · 暗色科技风个人博客
# 基于 Jekyll 的自定义主题（保留 markdown 写作 + GitHub Pages 自动部署）
# =============================================================

# ---- 站点信息 ----
title: JellyGD
subtitle: 好奇心强，喜欢新鲜事物，爱吃爱玩爱健身。
description: 张国东（Jelly）的技术博客 —— 记录 iOS / Objective-C / 内存管理 / 性能优化 / 设计模式与工程实践。
language: zh-Hans
timezone: Asia/Shanghai
date_format: '%Y-%m-%d'

# ---- URL ----
url: https://jellygd.github.io
baseurl:
permalink: pretty

# ---- 构建 ----
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge

# 发布时忽略的文件
exclude:
  - README.md
  - README.en.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - LocalLLMDemo
  - AgentToolDemo

# ---- 分页（仅首页）----
paginate: 6
paginate_path: "/page:num/"

# ---- 插件（均为 GitHub Pages 白名单内）----
plugins:
  - jekyll-paginate
  - jemoji
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ---- 资源 ----
avatar: /assets/images/avatar.png
logo: /assets/logo.jpeg
favicon: /assets/favicon.ico

# ---- 导航 ----
menu:
  - title: 首页
    url: /
  - title: 归档
    url: /archives/
  - title: 标签
    url: /tags/
  - title: 分类
    url: /categories/
  - title: 关于
    url: /about/

# ---- 社交 ----
social:
  github: https://github.com/JellyGD
  twitter: https://twitter.com/
  weibo: https://weibo.com/

# ---- 作者资料（用于关于页 / SEO / 英雄区）----
author:
  name: 张国东
  nickname: Jelly
  handle: JellyGD
  bio: iOS / Objective-C 开发者。好奇心强，喜欢新鲜事物，爱吃爱玩爱健身。
  github: JellyGD
  location: China

# ---- RSS ----
feed:
  path: atom.xml
