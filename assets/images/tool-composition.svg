<svg viewBox="0 0 680 300" width="100%" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>一个 Tool 的构成</title>
  <desc>模型侧契约与运行时契约</desc>
  <rect x="40" y="36" width="600" height="240" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="68" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">一个 Tool 的构成：模型侧契约 + 运行时契约</text>
  <g>
    <rect x="64" y="86" width="270" height="170" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="86" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">模型侧契约</text>
    <text x="86" y="140" font-family="sans-serif" font-size="12" fill="#085041">能力描述：name + description</text>
    <text x="86" y="160" font-family="sans-serif" font-size="12" fill="#085041">（干什么 / 不干什么）</text>
    <text x="86" y="188" font-family="sans-serif" font-size="12" fill="#085041">参数 Schema：类型 · 必填</text>
    <text x="86" y="208" font-family="sans-serif" font-size="12" fill="#085041">枚举 · 取值范围</text>
  </g>
  <g>
    <rect x="346" y="86" width="270" height="170" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="368" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">运行时契约</text>
    <text x="368" y="140" font-family="sans-serif" font-size="12" fill="#854F0B">权限画像 PermissionPolicy</text>
    <text x="368" y="164" font-family="sans-serif" font-size="12" fill="#854F0B">执行体：本地代码 / MCP</text>
    <text x="368" y="188" font-family="sans-serif" font-size="12" fill="#854F0B">校验器：parseArguments 强校验</text>
    <text x="368" y="212" font-family="sans-serif" font-size="12" fill="#854F0B">回灌器：成功 + 失败回灌</text>
  </g>
</svg>
