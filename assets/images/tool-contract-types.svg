<svg viewBox="0 0 680 280" width="100%" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>端侧 Agent 的两类 Tool 契约</title>
  <desc>展示型工具与执行型工具的契约区别</desc>
  <rect x="40" y="36" width="600" height="208" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="68" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Tool 契约：两类工具</text>
  <g>
    <rect x="64" y="86" width="270" height="142" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="86" y="114" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">展示型工具</text>
    <text x="86" y="142" font-family="sans-serif" font-size="12" fill="#085041">模型把结构化数据写进 arguments</text>
    <text x="86" y="164" font-family="sans-serif" font-size="12" fill="#085041">前端直接渲染，无副作用</text>
    <text x="86" y="186" font-family="sans-serif" font-size="12" fill="#085041">例：present_baby_foods</text>
    <text x="86" y="210" font-family="sans-serif" font-size="12" fill="#085041">真理在模型写出的 JSON 里</text>
  </g>
  <g>
    <rect x="346" y="86" width="270" height="142" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="368" y="114" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">执行型工具</text>
    <text x="368" y="142" font-family="sans-serif" font-size="12" fill="#712B13">模型输出意图，外部代码执行</text>
    <text x="368" y="164" font-family="sans-serif" font-size="12" fill="#712B13">结果回灌模型继续对话</text>
    <text x="368" y="186" font-family="sans-serif" font-size="12" fill="#712B13">例：create_local_reminder</text>
    <text x="368" y="210" font-family="sans-serif" font-size="12" fill="#712B13">真理在 App 跑完的回灌里</text>
  </g>
</svg>
